<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Styled Page</title>
    <style>
        /* Your CSS code goes inside this <style> tag */
        body {
            background-color: #f3a367e4;
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: #000000d8;
        }

        p {
            color: #333333;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>
    <p>This text is styled using CSS right inside the HTML file.</p>

</body>
</html>
